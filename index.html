<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Username & Password Input</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 320px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        input {
            width: 92%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #007bff;
        }
        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn {
            background: #007bff;
            color: white;
            margin-right: 5px;
        }
        .login-btn:hover {
            background: #0056b3;
        }
        .clear-btn {
            background: #dc3545;
            color: white;
            margin-left: 5px;
        }
        .clear-btn:hover {
            background: #a71d2a;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Login</h2>
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password">
        </div>
        <div class="button-container">
            <button class="login-btn" onclick="validateLogin()">Login</button>
            <button class="clear-btn" onclick="clearFields()">Clear</button>
        </div>
    </div>

    <script>
        function validateLogin() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            console.log("Username:", username); // Logs the username
            console.log("Password:", password); // Logs the password (for debugging)

            if (username === "" || password === "") {
                alert("Please fill in all fields.");
                return;
            }

            // Password validation: At least 8 characters, both uppercase and lowercase
            var passwordCriteria = /^(?=.*[a-z])(?=.*[A-Z]).{8,}$/;

            if (!passwordCriteria.test(password)) {
                alert("Password must be at least 8 characters long and include both uppercase and lowercase letters.");
                return;
            }

            alert("Welcome!" + " " + username);
        }

        function clearFields() {
            var username = document.getElementById("username");
            var password = document.getElementById("password");
            username.value = "";
            password.value = "";
        }
    </script>

</body>
</html>
